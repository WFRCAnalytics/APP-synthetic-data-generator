name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # prebuild copies the pinned DuckDB-WASM binaries into public/duckdb/
      - run: npm run build
      # The word lists must be in the generate worker only (specs/002 FR-015); needs the build above
      - run: npx vitest run tests/unit/bundle-wordlists.test.ts
      # The self-hosted Excel extension must load under the strict policy and read a workbook (FR-017)
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium excel-extension parquet-extension json-extension
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
